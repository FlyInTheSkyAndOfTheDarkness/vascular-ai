name: vascularai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vascularai
      POSTGRES_USER: vascularai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python tools/setup_server.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vascularai -d vascularai"]
      interval: 5s
      timeout: 5s
      retries: 20

  cabinet:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://vascularai:${POSTGRES_PASSWORD}@db:5432/vascularai?sslmode=disable
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python tools/setup_server.py first}
      PERSISTENT_LOCAL_STORAGE: "1"
      STREAMLIT_SERVER_COOKIE_SECRET: ${COOKIE_SECRET:?Run python tools/setup_server.py first}
      STREAMLIT_BROWSER_SERVER_ADDRESS: cabinet.med-it.asia
      STREAMLIT_BROWSER_SERVER_PORT: "443"
      TZ: Asia/Qyzylorda
    volumes:
      - attachments_data:/app/data/clinic/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "tools/healthcheck.py"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static/landing:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cabinet:
        condition: service_healthy

volumes:
  postgres_data:
  attachments_data:
  caddy_data:
  caddy_config:
