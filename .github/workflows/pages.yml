name: Deploy landing to GitHub Pages

# Публикует статический лендинг (папка static/landing) на GitHub Pages.
# Кабинет врача — это Streamlit-приложение, ему нужен Python-процесс и WebSocket,
# поэтому он живёт отдельно (Streamlit Community Cloud), а не на Pages.

on:
  push:
    branches: [main]
    paths:
      - "static/landing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать статику
        run: |
          mkdir -p _site
          cp -r static/landing/. _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
